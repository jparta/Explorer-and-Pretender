# Valkey's settings (docs/phase-1/components/valkey.md, section 2).

# Persistence: an append-only file, flushed to disk once a second (D23).
appendonly yes
appendfsync everysec
# No periodic snapshots: the append-only file already holds everything.
save ""
dir /data

# Refuse writes before reaching the container's 64 MiB limit, never delete keys (D40).
maxmemory 48mb
maxmemory-policy noeviction

# Users and permissions, assembled at start-up from users.acl and the passwords (D46, D50).
aclfile /tmp/users.acl
