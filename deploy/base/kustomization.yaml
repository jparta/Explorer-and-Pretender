# The manifests shared by every environment (D10). Components are added here
# one by one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: exhibition
resources:
  - namespace.yaml
  - valkey
  - runner
# The settings more than one component reads (shared component doc, section 4),
# in one ConfigMap that each of them loads, so they can't differ between components.
configMapGenerator:
  - name: settings
    literals:
      - PRESENCE_TIMEOUT_SECONDS=30
      - REVEAL_RATE_EXPLORER_CHARS_PER_SECOND=30
      - REVEAL_RATE_PRETENDER_CHARS_PER_SECOND=120
