# Development only: fixed passwords for the local cluster's Valkey users (D49, D51).
# The cluster is reachable only from this machine, so these being public is harmless.
# Production provides its own valkey-passwords Secret; the base has no passwords.
# Letters, digits and hyphens only: Valkey's start-up script substitutes them with sed.
apiVersion: v1
kind: Secret
metadata:
  name: valkey-passwords
type: Opaque
stringData:
  runner: dev-runner-password
  web: dev-web-password
  admin: dev-admin-password
